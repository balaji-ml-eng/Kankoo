name: iOS launch check

on:
  push:
    branches: [diag/ios-verify]

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-pub
      - name: Boot simulator
        run: |
          xcrun simctl list devices available -j | python3 -c 'import json,re,sys; devices=json.load(sys.stdin)["devices"]; runtime=max((r for r in devices if "SimRuntime.iOS-" in r),key=lambda r: tuple(map(int,re.findall(r"\d+",r)))); print("SIMULATOR_UDID="+next(d["udid"] for d in devices[runtime] if d["name"].startswith("iPhone")))' >> "$GITHUB_ENV"
          . "$GITHUB_ENV" || true
      - name: Open the app and check startup
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
          # Flutter's print output goes to the unified system log on iOS.
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --level debug --style compact \
            --predicate 'process == "Runner"' > system.log 2>&1 &
          sleep 5
          xcrun simctl launch --stdout="$PWD/stdout.log" --stderr="$PWD/stderr.log" "$SIMULATOR_UDID" com.kankoo.kankoo
          sleep 60
          cat system.log stdout.log stderr.log > all.log 2>/dev/null || true
          running=no; xcrun simctl spawn "$SIMULATOR_UDID" launchctl list | grep -q com.kankoo.kankoo && running=yes
          entry=no; grep -q 'Dart entry reached' all.log && entry=yes
          ready=no; grep -q 'saved settings ready' all.log && ready=yes
          lines=$(grep -oE '\[kankoo-startup\].*' all.log | awk '!seen[$0]++' | head -8 | paste -sd'|' -)
          errors=$(grep -E 'Unhandled Exception|PlatformException|MissingPluginException|Terminating app' all.log | cut -c1-200 | head -5 | paste -sd'|' -)
          echo "::notice title=ios-launch::running=$running dartEntry=$entry settingsReady=$ready logLines=$(wc -l < all.log | tr -d ' ') $lines"
          echo "::notice title=ios-errors::${errors:-none matched}"
          xcrun simctl io "$SIMULATOR_UDID" screenshot startup.png
          sips -Z 560 -s format jpeg -s formatOptions 35 startup.png --out small.jpg > /dev/null
          base64 -i small.jpg | tr -d '\n' > shot.b64
          echo "::notice title=ios-screenshot::$(cat shot.b64)"
          [ $running = yes ] && [ $ready = yes ]
