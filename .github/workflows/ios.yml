name: iOS build checks

on:
  push:
    branches: [feature/ios-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Native encrypted inbox tests
        run: swift test --package-path ios/ShortcutInboxCore
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Dart tests
        run: flutter test
      - name: Build unsigned iPhone app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-pub
      - name: Test native action on iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/ios/ShortcutsTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Test Flutter bridge and encrypted ledger on simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          flutter test integration_test/ios_shortcuts_test.dart -d "$DEVICE" --no-pub
      - name: Package unsigned build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Kankoo-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kankoo-iOS-unsigned
          path: build/ios/Kankoo-unsigned.app.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-build-diagnostics
          path: |
            build/ios
          retention-days: 3
