name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build -d

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Verify APK architectures
        run: |
          python3 -m unittest discover -s tool -p test_verify_apk_architectures.py
          python3 tool/verify_apk_architectures.py build/app/outputs/flutter-apk/app-debug.apk --debug

      # Annotations can be read without the full log, so publish the key lines.
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          report() {
            body=$(head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$body"
          }
          { grep -A20 -F 'What went wrong' build.log || true; } | report "What went wrong"
          { grep -E '^e: |[Ee]rror:|Error [(]|FAILURE|Exception:' build.log || true; } | head -40 | report "Error lines"
          tail -n 30 build.log | report "Log tail"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kankoo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after the upload so a failing test never hides the APK;
      # the run is still marked as failed.
      - name: Run tests
        run: flutter test

  # Public releases are uploaded from a verified build signed with the persistent
  # release key. CI debug artifacts must never replace the signed download.

  notification-runtime:
    if: github.ref == 'refs/heads/feature/ca-evidence-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Compile app and instrumentation
        run: |
          flutter build apk --debug --target-platform android-x64
          cd android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest -Ptarget-platform=android-x64
          ./gradlew --stop
          cd ..
          # Disposable CI signing identity; never the persistent public-release key.
          keytool -genkeypair -keystore "$RUNNER_TEMP/ca-runtime.jks" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Disposable CA runtime test' -keyalg RSA -keysize 2048 -validity 2
          printf 'storeFile=%s/ca-runtime.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' "$RUNNER_TEMP" > android/key.properties
          flutter build apk --release --target-platform android-x64
          python3 tool/verify_apk_architectures.py build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" sign --ks "$RUNNER_TEMP/ca-runtime.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/ca-runtime-test.apk" build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cd android && ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb install -r "$RUNNER_TEMP/ca-runtime-test.apk"
            adb shell cmd notification allow_listener com.kankoo.kankoo/com.kankoo.kankoo.BankNotificationListener
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant com.kankoo.kankoo android.permission.POST_NOTIFICATIONS; fi
            adb shell am instrument -w -r com.kankoo.kankoo.test/androidx.test.runner.AndroidJUnitRunner | tee notification-runtime.txt
            grep -q 'OK (1 test)' notification-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca-notification-runtime-${{ matrix.api }}
          path: notification-runtime.txt
