name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build -d

      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug --target-platform android-arm64 2>&1 | tee build.log

      # Annotations can be read without the full log, so publish the key lines.
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          report() {
            body=$(head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$body"
          }
          { grep -A20 -F 'What went wrong' build.log || true; } | report "What went wrong"
          { grep -E '^e: |[Ee]rror:|Error (|FAILURE|Exception:' build.log || true; } | head -40 | report "Error lines"
          tail -n 30 build.log | report "Log tail"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kankoo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after the upload so a failing test never hides the APK;
      # the run is still marked as failed.
      - name: Run tests
        run: flutter test
