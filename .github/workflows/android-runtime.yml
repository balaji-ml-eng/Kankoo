name: Startup diagnosis (debug vs release vs release without minify)

on:
  push:
    branches: [diag/startup-error]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [release-minified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d

      - name: Throwaway signing key (diagnosis only, never published)
        if: matrix.variant != 'debug'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/diag.jks" -alias diag -keyalg RSA -keysize 2048 -validity 2 \
            -storepass diagpass1 -keypass diagpass1 -dname "CN=diag"
          printf 'keyAlias=diag\nkeyPassword=diagpass1\nstoreFile=%s\nstorePassword=diagpass1\n' "$RUNNER_TEMP/diag.jks" > android/key.properties

      - name: Turn off R8 for the no-minify variant
        if: matrix.variant == 'release-no-minify'
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/; s/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts
          grep -n 'isMinifyEnabled\|isShrinkResources' android/app/build.gradle.kts

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = debug ]; then flutter build apk --debug --target-platform android-x64; else flutter build apk --release --target-platform android-x64; fi
          ls build/app/outputs/flutter-apk/*.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tool/probe_android_startup.py build/app/outputs/flutter-apk/app-${{ matrix.variant == 'debug' && 'debug' || 'release' }}.apk
