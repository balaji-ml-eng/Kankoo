name: iPhone sideload IPA

on:
  workflow_dispatch:
  push:
    branches: [feature/ios-support]
    paths:
      - .github/workflows/ios-ipa.yml
      - scripts/package_ios_ipa.py

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: flutter pub get
      - name: Build arm64 iPhone release app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package and verify unsigned IPA
        run: python3 scripts/package_ios_ipa.py build/ios/iphoneos/Runner.app build/ios/kankoo-ios-1.0.3-sideload.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Kankoo-iPhone-sideload-IPA
          path: |
            build/ios/kankoo-ios-1.0.3-sideload.ipa
            build/ios/kankoo-ios-1.0.3-sideload.ipa.sha256
          retention-days: 14
